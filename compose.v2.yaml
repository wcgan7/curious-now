services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: curious_now_v2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - curious_now_v2_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d curious_now_v2"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  curious_now_v2_pgdata:
